services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: microbeta
      POSTGRES_PASSWORD: microbeta
      POSTGRES_DB: microbeta
    # 5433 côté machine : le 5432 est souvent pris par un Postgres déjà installé.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crée aussi la base microbeta_test (exécuté seulement au premier démarrage du volume).
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microbeta"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
